<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>BORN 영어학원 반/학생 관리</title>
				<style>
					body {
					margin: 0; padding: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #F8F9FA;
					color: #333333; display: flex; justify-content: center;
					}
					.app-container {
					width: 100%; max-width: 480px; min-height: 100vh;
					background-color: #FFFFFF; box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
					padding: 24px 20px; box-sizing: border-box;
					}
					header { text-align: center; margin-bottom: 24px; border-bottom: 1px solid #E9ECEF; padding-bottom: 15px;}
					.brand-title { font-size: 20px; font-weight: 700; color: #2B4C7E; margin: 0; }
					.brand-subtitle { font-size: 13px; color: #6C757D; margin-top: 4px; }

					.section-title { font-size: 16px; font-weight: 700; color: #2B4C7E; margin-bottom: 12px; margin-top: 24px;}
					.card { background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; margin-bottom: 20px; }

					.input-group { display: flex; gap: 8px; margin-bottom: 12px; }
					.input-group input, .input-group select {
					flex: 1; padding: 10px; font-size: 14px; border: 1px solid #CBD5E1; border-radius: 8px; outline: none;
					}
					.btn-primary {
					padding: 0 16px; font-size: 14px; font-weight: 600; color: #FFF;
					background-color: #2B4C7E; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap;
					}
					.btn-primary:hover { background-color: #1A3256; }

					.list-item {
					display: flex; justify-content: space-between; align-items: center;
					background: #FFF; padding: 12px; border: 1px solid #E2E8F0; border-radius: 8px; margin-bottom: 8px;
					}
					.list-item span { font-size: 15px; font-weight: 600; color: #334155; }
					.action-btns { display: flex; gap: 6px; }
					.btn-edit { background: #F59E0B; color: #FFF; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold;}
					.btn-delete { background: #EF4444; color: #FFF; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold;}

					.empty-msg { text-align: center; font-size: 13px; color: #94A3B8; padding: 10px 0; }

					.class-tag {
					background:#E2E8F0; padding:6px 12px; border-radius:15px;
					font-size:13px; font-weight:bold; color:#475569;
					display:flex; align-items:center; gap:8px;
					}
					.class-delete-btn { color: #EF4444; cursor: pointer; font-weight: 900; }

					/* 🚨 클릭할 수 있는 학생 이름 스타일 추가 */
					.student-link { cursor: pointer; color: #2B4C7E; text-decoration: underline; text-underline-offset: 4px; }
					.student-link:hover { color: #1E3A8A; font-weight: 700; }
				</style>

				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container">
			<header>
				<h1 class="brand-title">BORN 영어학원</h1>
				<div class="brand-subtitle">반 & 학생 관리 시스템</div>
			</header>

			<div class="section-title">🏫 반 만들기</div>
			<div class="card">
				<div class="input-group">
					<input type="text" id="newClassName" placeholder="새로운 반 이름 (예: 파닉스 A반)">
						<button class="btn-primary" onclick="addClass()">반 추가</button>
					</div>
				<div id="classListMenu" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
			</div>

			<div class="section-title">🧑‍🎓 학생 관리 (추가/수정/삭제)</div>
			<div class="card">
				<div class="input-group">
					<select id="classSelector" onchange="loadStudents()">
						<option value="">반을 선택해주세요</option>
					</select>
				</div>

				<div class="input-group">
					<input type="text" id="newStudentName" placeholder="학생 이름 입력">
						<button class="btn-primary" onclick="addStudent()">학생 등록</button>
					</div>

				<div id="studentList" style="margin-top: 15px;">
					<div class="empty-msg">반을 선택하면 학생 목록이 나타납니다.</div>
				</div>
			</div>

			<div style="text-align: center; margin-top: 20px;">
				<a href="index.html" style="color: #2B4C7E; font-size: 14px; font-weight: bold; text-decoration: none;">← 점수 입력 화면으로 돌아가기</a>
			</div>
		</div>

		<script>
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			if (sessionStorage.getItem("bornAuth") !== "true") {
			alert("선생님 전용 페이지입니다. 먼저 로그인을 해주세요!");
			window.location.href = "login.html";

			window.onload = function() { loadClasses(); };

			function addClass() {
			const className = document.getElementById('newClassName').value.trim();
			if (!className) return alert("반 이름을 입력해주세요!");
			db.collection("classes").add({
			name: className,
			createdAt: firebase.firestore.FieldValue.serverTimestamp()
			}).then(() => {
			document.getElementById('newClassName').value = '';
			loadClasses();
			});
			}

			function loadClasses() {
			db.collection("classes").orderBy("createdAt", "asc").get().then((snapshot) => {
			const classSelector = document.getElementById('classSelector');
			const classListMenu = document.getElementById('classListMenu');

			classSelector.innerHTML = '<option value="">학생을 관리할 반을 선택하세요</option>';
			classListMenu.innerHTML = '';

			snapshot.forEach((doc) => {
			const data = doc.data();
			classSelector.innerHTML += `<option value="${doc.id}">${data.name}</option>`;
			classListMenu.innerHTML += `
			<div class="class-tag">
				${data.name}
				<span class="class-delete-btn" onclick="deleteClass('${doc.id}', '${data.name}')">✕</span>
			</div>
			`;
			});
			});
			}

			function deleteClass(classId, className) {
			if(confirm(`정말로 '${className}'을(를) 삭제하시겠습니까?`)) {
			db.collection("classes").doc(classId).delete().then(() => {
			loadClasses();
			document.getElementById('studentList').innerHTML = '<div class="empty-msg">반을 선택하면 학생 목록이 나타납니다.</div>';
			});
			}
			}

			function addStudent() {
			const classId = document.getElementById('classSelector').value;
			const studentName = document.getElementById('newStudentName').value.trim();
			if (!classId) return alert("먼저 반을 선택해주세요!");
			if (!studentName) return alert("학생 이름을 입력해주세요!");

			db.collection("students").add({
			classId: classId,
			name: studentName,
			createdAt: firebase.firestore.FieldValue.serverTimestamp()
			}).then(() => {
			document.getElementById('newStudentName').value = '';
			loadStudents();
			});
			}

			function loadStudents() {
			const classId = document.getElementById('classSelector').value;
			const studentList = document.getElementById('studentList');

			if (!classId) {
			studentList.innerHTML = '<div class="empty-msg">반을 선택하면 학생 목록이 나타납니다.</div>';
			return;
			}

			studentList.innerHTML = '<div class="empty-msg">학생 목록을 불러오는 중...</div>';

			db.collection("students").where("classId", "==", classId).get().then((snapshot) => {
			if (snapshot.empty) {
			studentList.innerHTML = '<div class="empty-msg">이 반에는 아직 등록된 학생이 없습니다.</div>';
			return;
			}

			studentList.innerHTML = '';
			snapshot.forEach((doc) => {
			const data = doc.data();
			studentList.innerHTML += `
			<div class="list-item">
				<!-- 🚨 클릭하면 index.html로 정보를 싸들고 넘어가는 기능 추가 -->
				<span class="student-link" onclick="goToInputScore('${classId}', '${data.name}')">
					📝 ${data.name} (점수입력)
				</span>
				<div class="action-btns">
					<button class="btn-edit" onclick="editStudent('${doc.id}', '${data.name}')">수정</button>
					<button class="btn-delete" onclick="deleteStudent('${doc.id}', '${data.name}')">삭제</button>
				</div>
			</div>
			`;
			});
			});
			}

			// 🚨 새로 추가된 페이지 이동 함수
			function goToInputScore(classId, studentName) {
			// 주소창 뒤에 물음표(?)를 붙이고 반 아이디와 학생 이름을 숨겨서 보냅니다.
			window.location.href = `index.html?classId=${classId}&studentName=${encodeURIComponent(studentName)}`;
			}

			function editStudent(studentId, currentName) {
			const newName = prompt("수정할 학생의 이름을 입력해주세요:", currentName);
			if (newName && newName.trim() !== "" && newName !== currentName) {
			db.collection("students").doc(studentId).update({ name: newName.trim() }).then(() => { loadStudents(); });
			}
			}

			function deleteStudent(studentId, studentName) {
			if (confirm(`정말로 '${studentName}' 학생을 삭제하시겠습니까?`)) {
			db.collection("students").doc(studentId).delete().then(() => { loadStudents(); });
			}
			}
		</script>
	</body>
</html>
