<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>BORN 영어학원 월간 리포트</title>
				<style>
					body {
					margin: 0; padding: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #F8F9FA; color: #333333; display: flex; justify-content: center;
					}
					.app-container {
					width: 100%; max-width: 480px; min-height: 100vh;
					background-color: #FFFFFF; box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
					padding: 24px 20px; box-sizing: border-box;
					}
					header { text-align: center; margin-bottom: 28px; }
					.brand-title { font-size: 20px; font-weight: 700; color: #2B4C7E; letter-spacing: 1px; margin: 0; }
					.brand-subtitle { font-size: 13px; color: #6C757D; margin-top: 4px; }

					.card { background-color: #FFFFFF; border: 1px solid #E9ECEF; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
					.score-row { display: flex; gap: 10px; }
					.score-row .form-group { flex: 1; }
					.form-group { margin-bottom: 16px; }
					.form-group label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
					.form-group input, .form-group select {
					width: 100%; padding: 12px; font-size: 15px;
					border: 1px solid #CED4DA; border-radius: 8px; box-sizing: border-box; outline: none;
					}
					.form-group input:focus, .form-group select:focus { border-color: #2B4C7E; }

					.btn-submit {
					width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: #FFFFFF;
					background-color: #2B4C7E; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 15px;
					}
					.btn-submit:hover { background-color: #1A3256; }

					.nav-links { display: flex; justify-content: space-between; padding: 0 10px; flex-wrap: wrap; gap: 10px;}
					.nav-links a { font-size: 13px; color: #6C757D; text-decoration: none; font-weight: 600; cursor: pointer;}
					.nav-links a:hover { color: #2B4C7E; text-decoration: underline; }
				</style>

				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container">
			<header>
				<h1 class="brand-title">BORN 영어학원</h1>
				<div class="brand-subtitle">매일 단어 시험 성적 입력</div>
			</header>

			<main>
				<div class="card">
					<div class="form-group">
						<label>반 선택</label>
						<select id="classSelector" onchange="loadStudents()">
							<option value="">먼저 반을 선택해주세요</option>
						</select>
					</div>
					<div class="form-group">
						<label>학생 선택</label>
						<select id="studentSelector">
							<option value="">학생을 선택해주세요</option>
						</select>
					</div>

					<div class="form-group">
						<label>시험 날짜</label>
						<input type="date" id="testDate">
                </div>

					<div class="score-row">
						<div class="form-group">
							<label>만점 기준</label>
							<input type="number" id="maxScore" value="100">
                    </div>
						<div class="form-group">
							<label>획득 점수</label>
							<input type="number" id="score" placeholder="예: 95">
                    </div>
					</div>

					<button class="btn-submit" onclick="saveScore()">오늘 점수 저장하기</button>
				</div>

				<!-- 🚨 로그아웃 버튼이 추가되었습니다 -->
				<div class="nav-links">
					<a href="manage.html">⚙️ 반/학생 관리</a>
					<a href="report.html">📊 성적 결과 확인</a>
					<a onclick="logout()" style="color: #EF4444;">🚪 로그아웃</a>
				</div>
			</main>
		</div>

		<script>
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			// 🚨 1. 문지기 코드 (완벽한 위치에 배치)
			if (sessionStorage.getItem("bornAuth") !== "true") {
			alert("선생님 전용 페이지입니다. 먼저 로그인을 해주세요!");
			window.location.href = "login.html";
			}

			// 🚨 2. 로그아웃 기능 추가
			function logout() {
			sessionStorage.removeItem("bornAuth");
			alert("안전하게 로그아웃 되었습니다.");
			window.location.href = "login.html";
			}

			document.getElementById('testDate').valueAsDate = new Date();

			window.onload = function() {
			const urlParams = new URLSearchParams(window.location.search);
			const preSelectClassId = urlParams.get('classId');
			const preSelectStudentName = urlParams.get('studentName');

			db.collection("classes").orderBy("createdAt", "asc").get().then((snapshot) => {
			const classSelector = document.getElementById('classSelector');
			snapshot.forEach((doc) => {
			const data = doc.data();
			classSelector.innerHTML += `<option value="${doc.id}">${data.name}</option>`;
			});

			if (preSelectClassId) {
			classSelector.value = preSelectClassId;
			loadStudents(preSelectStudentName);
			}
			});
			};

			function loadStudents(autoSelectName = null) {
			const classId = document.getElementById('classSelector').value;
			const studentSelector = document.getElementById('studentSelector');

			if (!classId) {
			studentSelector.innerHTML = '<option value="">학생을 선택해주세요</option>';
			return;
			}

			studentSelector.innerHTML = '<option value="">불러오는 중...</option>';

			db.collection("students").where("classId", "==", classId).get().then((snapshot) => {
			studentSelector.innerHTML = '<option value="">학생을 선택해주세요</option>';
			snapshot.forEach((doc) => {
			const data = doc.data();
			studentSelector.innerHTML += `<option value="${data.name}">${data.name}</option>`;
			});

			if (typeof autoSelectName === 'string' && autoSelectName) {
			studentSelector.value = autoSelectName;
			}
			});
			}

			function saveScore() {
			const name = document.getElementById('studentSelector').value;
			const date = document.getElementById('testDate').value;
			const maxScore = document.getElementById('maxScore').value;
			const score = document.getElementById('score').value;

			if (!name || !date || !maxScore || !score) {
			alert("학생, 날짜, 만점 기준, 획득 점수를 모두 입력해 주세요!");
			return;
			}
			if (Number(score) > Number(maxScore)) {
			alert("획득 점수가 만점보다 클 수 없습니다. 다시 확인해 주세요!");
			return;
			}

			db.collection("scores")
			.where("name", "==", name)
			.where("date", "==", date)
			.get()
			.then((querySnapshot) => {
			if (!querySnapshot.empty) {
			const isUpdate = confirm(`⚠️ ${date} 날짜에 이미 '${name}' 학생의 성적이 있습니다.\n입력하신 점수(${score}점)로 수정하시겠습니까?`);

			if (isUpdate) {
			const docId = querySnapshot.docs[0].id;
			db.collection("scores").doc(docId).update({
			maxScore: Number(maxScore),
			score: Number(score),
			timestamp: firebase.firestore.FieldValue.serverTimestamp()
			}).then(() => {
			showSuccessPopup(name, "수정");
			}).catch((error) => {
			alert("수정 중 오류가 발생했습니다: " + error.message);
			});
			}
			} else {
			db.collection("scores").add({
			name: name,
			date: date,
			maxScore: Number(maxScore),
			score: Number(score),
			timestamp: firebase.firestore.FieldValue.serverTimestamp()
			}).then(() => {
			showSuccessPopup(name, "저장");
			}).catch((error) => {
			alert("저장 중 오류가 발생했습니다: " + error.message);
			});
			}
			}).catch((error) => {
			alert("중복 데이터 확인 중 오류가 발생했습니다: " + error.message);
			});
			}

			function showSuccessPopup(name, actionWord) {
			if (confirm(`${name} 학생의 점수가 성공적으로 ${actionWord}되었습니다! 🎉\n\n성적 결과 화면으로 이동하시겠습니까?`)) {
			window.location.href = "report.html?studentName=" + encodeURIComponent(name);
			} else {
			document.getElementById('score').value = '';
			}
			}
		</script>
	</body>
</html>
