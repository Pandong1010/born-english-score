<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>BORN 영어학원 월간 리포트</title>
				<style>
					/* 전체 배경 및 폰트 설정 */
					body {
					margin: 0;
					padding: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #F8F9FA;
					color: #333333;
					display: flex;
					justify-content: center;
					}

					/* 모바일 앱 화면 비율에 맞춘 중앙 컨테이너 */
					.app-container {
					width: 100%;
					max-width: 480px;
					min-height: 100vh;
					background-color: #FFFFFF;
					box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
					padding: 24px 20px;
					box-sizing: border-box;
					}

					header {
					text-align: center;
					margin-bottom: 28px;
					}

					.brand-title {
					font-size: 20px;
					font-weight: 700;
					color: #2B4C7E;
					letter-spacing: 1px;
					margin: 0;
					}

					.brand-subtitle {
					font-size: 13px;
					color: #6C757D;
					margin-top: 4px;
					}

					.card {
					background-color: #FFFFFF;
					border: 1px solid #E9ECEF;
					border-radius: 12px;
					padding: 20px;
					margin-bottom: 20px;
					}

					.score-row {
					display: flex;
					gap: 10px;
					}
					.score-row .form-group {
					flex: 1;
					}

					.form-group {
					margin-bottom: 16px;
					}

					.form-group label {
					display: block;
					font-size: 13px;
					font-weight: 600;
					color: #495057;
					margin-bottom: 6px;
					}

					.form-group input {
					width: 100%;
					padding: 12px;
					font-size: 15px;
					border: 1px solid #CED4DA;
					border-radius: 8px;
					box-sizing: border-box;
					outline: none;
					}

					.form-group input:focus {
					border-color: #2B4C7E;
					}

					.btn-submit {
					width: 100%;
					padding: 14px;
					font-size: 15px;
					font-weight: 600;
					color: #FFFFFF;
					background-color: #2B4C7E;
					border: none;
					border-radius: 8px;
					cursor: pointer;
					}

					.btn-submit:hover {
					background-color: #1A3256;
					}
				</style>

				<!-- 🚀 구글 파이어베이스 기능을 가져오는 마법의 줄입니다 -->
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container">
			<header>
				<h1 class="brand-title">BORN 영어학원</h1>
				<div class="brand-subtitle">매일 단어 시험 월간 리포트</div>
			</header>

			<main>
				<div class="card">
					<div class="form-group">
						<label for="studentName">학생 이름</label>
						<input type="text" id="studentName" placeholder="예: 김철수">
        </div>

					<div class="form-group">
						<label for="testDate">시험 날짜</label>
						<input type="date" id="testDate">
        </div>

					<div class="score-row">
						<div class="form-group">
							<label for="maxScore">만점 기준</label>
							<input type="number" id="maxScore" placeholder="예: 100">
          </div>
						<div class="form-group">
							<label for="score">획득 점수</label>
							<input type="number" id="score" placeholder="예: 95">
          </div>
					</div>

					<button class="btn-submit" onclick="saveScore()">오늘 점수 저장하기</button>
				</div>
			</main>
		</div>

		<script>
			// 1. 발급받으신 비밀 열쇠를 넣었습니다!
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};

			// 2. 파이어베이스 창고 문을 엽니다.
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			// 오늘 날짜 자동 입력
			document.getElementById('testDate').valueAsDate = new Date();

			function saveScore() {
			const name = document.getElementById('studentName').value;
			const date = document.getElementById('testDate').value;
			const maxScore = document.getElementById('maxScore').value;
			const score = document.getElementById('score').value;

			if (!name || !date || !maxScore || !score) {
			alert("이름, 날짜, 만점 기준, 획득 점수를 모두 입력해 주세요!");
			return;
			}

			if (Number(score) > Number(maxScore)) {
			alert("획득 점수가 만점보다 클 수 없습니다. 다시 확인해 주세요!");
			return;
			}

			// 3. 데이터를 모아서 진짜 구글 창고(scores 라는 이름의 폴더)로 전송합니다!
			db.collection("scores").add({
			name: name,
			date: date,
			maxScore: Number(maxScore),
			score: Number(score),
			timestamp: firebase.firestore.FieldValue.serverTimestamp()
			})
			.then(function() {
			alert(name + " 학생의 점수가 데이터베이스에 안전하게 저장되었습니다! 🎉");
			// 원장님이 다음 학생을 바로 입력하기 편하게 이름과 점수 칸만 비워줍니다.
			document.getElementById('studentName').value = '';
			document.getElementById('score').value = '';
			})
			.catch(function(error) {
			alert("저장 중 오류가 발생했습니다: " + error.message);
			});
			}
		</script>

	</body>
</html>
