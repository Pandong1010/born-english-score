<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>BORN 영어학원 성적 관리</title>
				<style>
					body {
					margin: 0; padding: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #F4F7F6;
					color: #333; display: flex; justify-content: center;
					}
					.app-container {
					width: 100%; max-width: 480px; min-height: 100vh;
					background-color: #FFF; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
					padding: 30px 20px; box-sizing: border-box;
					position: relative;
					}
					header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #F0F2F5; padding-bottom: 15px;}

					.logo-img { width: 160px; height: auto; margin-bottom: 10px; border-radius: 12px; }
					.brand-title { font-size: 18px; font-weight: 700; color: #1E3A8A; margin: 0; }
					.brand-subtitle { font-size: 13px; color: #6C757D; margin-top: 4px; }

					.search-box { display: flex; gap: 6px; margin-bottom: 20px; }
					.search-box select {
					flex: 1; padding: 10px; font-size: 13px;
					border: 1px solid #D1D5DB; border-radius: 8px; outline: none;
					}
					.search-box button {
					padding: 0 14px; font-size: 13px; font-weight: 600; color: #FFF;
					background-color: #1E3A8A; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap;
					}

					.calendar-container { display: none; margin-top: 20px; }

					.week-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px; }
					.week-btn { border: none; background: none; font-size: 20px; color: #1E3A8A; cursor: pointer; font-weight: bold; }
					.week-btn:hover { color: #3B82F6; }
					.month-title { text-align: center; font-size: 16px; font-weight: bold; color: #374151; margin: 0; }

					.calendar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
					.day-header { font-size: 12px; color: #4B5563; font-weight: 700; padding-bottom: 5px; }

					.day-cell {
					border: 1px solid #E5E7EB; border-radius: 6px; padding: 8px 2px; min-height: 50px;
					font-size: 12px; background: #FFF; color: #9CA3AF; cursor: pointer; transition: 0.2s;
					display: flex; flex-direction: column; justify-content: center;
					}
					.day-cell:hover { background-color: #F8FAFC; border-color: #CBD5E1; }

					.day-cell.has-score { background: #EFF6FF; border-color: #BFDBFE; color: #1E3A8A; font-weight: 600; }
					.day-cell.has-score:hover { background-color: #DBEAFE; }

					.day-cell.status-absent { background: #FEF2F2; border-color: #FECACA; }
					.day-cell.status-absent:hover { background: #FEE2E2; }
					.day-cell.status-noclass { background: #F3F4F6; border-color: #E5E7EB; }
					.day-cell.status-noclass:hover { background: #E5E7EB; }

					.score-label { display: block; font-size: 12px; color: #E11D48; margin-top: 4px; font-weight: bold; letter-spacing: -0.5px; }
					.empty-label { display: block; font-size: 11px; color: #D1D5DB; margin-top: 4px; font-weight: normal; }

					.summary-box { background: #F8FAFC; border-radius: 8px; padding: 15px; text-align: center; margin-top: 20px; font-size: 15px; font-weight: 600; color: #0F172A;}

					.eval-box { margin-top: 15px; background: #FFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 15px; }
					.eval-box h3 { font-size: 14px; margin: 0 0 10px 0; color: #1E3A8A; }
					.eval-box textarea {
					width: 100%; padding: 10px; font-size: 13px; border: 1px solid #CBD5E1;
					border-radius: 6px; box-sizing: border-box; resize: none; outline: none;
					font-family: inherit;
					}
					.eval-box textarea:focus { border-color: #3B82F6; }
					.btn-eval-save {
					width: 100%; padding: 10px; margin-top: 8px; font-size: 13px; font-weight: 600;
					color: #FFF; background-color: #3B82F6; border: none; border-radius: 6px; cursor: pointer;
					}
					.btn-eval-save:hover { background-color: #2563EB; }

					.btn-share {
					width: 100%; padding: 14px; margin-top: 15px; font-size: 14px; font-weight: 600;
					color: #475569; background-color: #FEE500; border: none; border-radius: 8px;
					cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
					}
					.btn-share:hover { background-color: #F4DC00; }

					/* 🚨 하단 메뉴 스타일 변경됨 */
					.nav-links { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; padding: 0 10px; }
					.nav-links a { font-size: 13px; color: #6C757D; text-decoration: none; font-weight: 600; cursor: pointer; }
					.nav-links a:hover { color: #2B4C7E; text-decoration: underline; }
					.nav-left { display: flex; gap: 15px; align-items: center; }
					.divider { color: #E5E7EB; font-size: 12px; }

					.modal-overlay {
					display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
					background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
					}
					.modal-box {
					background: #FFF; width: 90%; max-width: 320px; border-radius: 16px;
					padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
					}
					.modal-title { font-size: 16px; font-weight: 700; color: #1E3A8A; margin: 0 0 15px 0; text-align: center; }

					.modal-field { margin-bottom: 15px; }
					.modal-field label { display: block; font-size: 12px; font-weight: 600; color: #4B5563; margin-bottom: 6px; }
					.modal-field select { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #D1D5DB; border-radius: 8px; outline: none; }
					.modal-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
					.modal-input-group div { flex: 1; }
					.modal-input-group label { display: block; font-size: 12px; font-weight: 600; color: #4B5563; margin-bottom: 6px; }
					.modal-input-group input {
					width: 100%; padding: 10px; font-size: 14px; border: 1px solid #D1D5DB;
					border-radius: 8px; box-sizing: border-box; outline: none; text-align: center;
					}
					.modal-input-group input:focus { border-color: #3B82F6; }

					.modal-actions { display: flex; gap: 8px; }
					.btn-modal-cancel { flex: 1; padding: 12px; background: #F3F4F6; color: #4B5563; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
					.btn-modal-save { flex: 1; padding: 12px; background: #3B82F6; color: #FFF; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
					.btn-modal-delete { width: 100%; padding: 10px; background: #FFF; color: #EF4444; border: 1px solid #FCA5A5; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
				</style>

				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container">
			<header>
				<img src="KakaoTalk_20260808_183941740_01.png" alt="BORN 영어학원 로고" class="logo-img">
					<h1 class="brand-title">BORN 영어학원</h1>
					<div class="brand-subtitle">주간 단어 성적 관리</div>
				</header>

			<div class="search-box">
				<select id="classSelector" onchange="loadStudents()">
					<option value="">반 선택</option>
				</select>
				<select id="studentSelector">
					<option value="">학생 선택</option>
				</select>
				<button onclick="currentViewDate = new Date(); searchReport();">기록 열람</button>
			</div>

			<div id="calendarArea" class="calendar-container">
				<div class="week-nav">
					<button class="week-btn" onclick="changeWeek(-1)">◀</button>
					<div class="month-title" id="weekTitle">이번 주 단어 성적</div>
					<button class="week-btn" onclick="changeWeek(1)">▶</button>
				</div>

				<div class="calendar-grid">
					<div class="day-header">월</div>
					<div class="day-header">화</div>
					<div class="day-header">수</div>
					<div class="day-header">목</div>
					<div class="day-header">금</div>
				</div>

				<div class="calendar-grid" id="calendarDays"></div>

				<div class="summary-box" id="averageScore">
					누적 평균: 데이터를 불러오는 중...
				</div>

				<div class="eval-box">
					<h3>📝 이번 주 학습 평가 (학부모님 확인용)</h3>
					<textarea id="weekComment" rows="3" placeholder="이번 주 학생의 단어 학습 태도나 결과를 간단히 남겨주세요."></textarea>
					<button class="btn-eval-save" onclick="saveEvaluation()">코멘트 저장하기</button>
				</div>

				<button class="btn-share" onclick="copyParentLink()">
					💬 학부모님용 카톡 링크 자동 복사하기
				</button>
			</div>

			<!-- 🚨 새로 적용된 좌우 분리형 하단 메뉴 -->
			<div class="nav-links">
				<div class="nav-left">
					<a href="manage.html">⚙️ 반/학생 관리</a>
					<span class="divider">|</span>
					<a href="achievement.html">🏅 성취도 평가</a>
				</div>
				<a href="index.html">← 점수 입력으로 돌아가기</a>
			</div>
		</div>

		<div id="scoreModal" class="modal-overlay">
			<div class="modal-box">
				<h3 id="modalTitle" class="modal-title">기록 입력</h3>

				<div class="modal-field">
					<label>출결 상태</label>
					<select id="modalStatus" onchange="toggleScoreInputs()">
						<option value="present">✅ 정상 등원 (점수 입력)</option>
						<option value="absent">🚨 결석</option>
						<option value="no_class">➖ 수업 없음</option>
					</select>
				</div>

				<div class="modal-input-group" id="scoreInputArea">
					<div>
						<label>만점 기준</label>
						<input type="number" id="modalMaxScore">
                </div>
					<div>
						<label>획득 점수</label>
						<input type="number" id="modalScore" placeholder="예: 95">
                </div>
				</div>

				<div class="modal-actions">
					<button class="btn-modal-cancel" onclick="closeModal()">취소</button>
					<button class="btn-modal-save" onclick="saveModalScore()">저장하기</button>
				</div>
				<button class="btn-modal-delete" id="modalDeleteBtn" onclick="deleteModalScore()">🗑️ 이 날짜 기록 삭제</button>
			</div>
		</div>

		<script>
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			let currentViewDate = new Date();
			let currentMondayString = "";

			let editDocId = null;
			let editDate = null;
			let editName = null;

			window.onload = function() {
			const urlParams = new URLSearchParams(window.location.search);
			const studentNameFromUrl = urlParams.get('studentName');

			db.collection("classes").orderBy("createdAt", "asc").get().then((snapshot) => {
			const classSelector = document.getElementById('classSelector');
			snapshot.forEach((doc) => {
			const data = doc.data();
			classSelector.innerHTML += `<option value="${doc.id}">${data.name}</option>`;
			});

			if (studentNameFromUrl) {
			db.collection("students").where("name", "==", studentNameFromUrl).get().then(studentSnap => {
			if (!studentSnap.empty) {
			const studentData = studentSnap.docs[0].data();
			classSelector.value = studentData.classId;
			loadStudents(studentNameFromUrl, true);
			}
			});
			}
			});
			};

			function loadStudents(autoSelectName = null, autoSearch = false) {
			const classId = document.getElementById('classSelector').value;
			const studentSelector = document.getElementById('studentSelector');

			if (!classId) {
			studentSelector.innerHTML = '<option value="">학생 선택</option>';
			return;
			}
			studentSelector.innerHTML = '<option value="">불러오는 중...</option>';

			db.collection("students").where("classId", "==", classId).get().then((snapshot) => {
			studentSelector.innerHTML = '<option value="">학생 선택</option>';
			snapshot.forEach((doc) => {
			const data = doc.data();
			studentSelector.innerHTML += `<option value="${data.name}">${data.name}</option>`;
			});

			if (autoSelectName) {
			studentSelector.value = autoSelectName;
			if (autoSearch) {
			currentViewDate = new Date();
			searchReport();
			}
			}
			});
			}

			function changeWeek(offset) {
			currentViewDate.setDate(currentViewDate.getDate() + (offset * 7));
			searchReport();
			}

			function searchReport() {
			const searchName = document.getElementById('studentSelector').value;
			if (!searchName) { alert("먼저 확인하실 학생을 선택해 주세요."); return; }

			const d = new Date(currentViewDate);
			const day = d.getDay();
			const diff = d.getDate() - day + (day === 0 ? -6 : 1);

			const monday = new Date(d.setDate(diff));
			const friday = new Date(monday);
			friday.setDate(monday.getDate() + 4);

			currentMondayString = `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;

			document.getElementById('weekTitle').innerText =
			`${monday.getMonth() + 1}월 ${monday.getDate()}일 ~ ${friday.getMonth() + 1}월 ${friday.getDate()}일`;

			const weekDates = [];
			for (let i = 0; i < 5; i++) {
                const curr = new Date(monday);
                curr.setDate(monday.getDate() + i);
                const yyyy = curr.getFullYear();
                const mm = String(curr.getMonth() + 1).padStart(2, '0');
                const dd = String(curr.getDate()).padStart(2, '0');
                weekDates.push(`${yyyy}-${mm}-${dd}`);
            }

            db.collection("scores").where("name", "==", searchName).get()
            .then((querySnapshot) => {
                let totalScore = 0;
                let totalMaxScore = 0;
                let scoresData = {};

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (weekDates.includes(data.date)) {
                        scoresData[data.date] = { 
                            id: doc.id, 
                            score: data.score, 
                            maxScore: data.maxScore,
                            status: data.status || 'present' 
                        };
                    }
                });

                const calendarDays = document.getElementById('calendarDays');
                calendarDays.innerHTML = '';

                for (let i = 0; i < 5; i++) {
                    const dateString = weekDates[i];
                    const dObj = new Date(dateString);
                    const dayNum = dObj.getDate();

                    if (scoresData[dateString]) {
                        const data = scoresData[dateString];
                        let displayHtml = '';
                        let cellClass = 'day-cell has-score';

                        if (data.status === 'absent') {
                            displayHtml = `<span class="score-label" style="color:#EF4444; font-size:13px;">결석</span>`;
			cellClass += ' status-absent';
			} else if (data.status === 'no_class') {
			displayHtml = `<span class="score-label" style="color:#9CA3AF; font-size:13px;">수업 없음</span>`;
			cellClass += ' status-noclass';
			} else {
			displayHtml = `<span class="score-label">${data.score}/${data.maxScore}</span>`;
			totalScore += data.score;
			totalMaxScore += data.maxScore;
			}

			calendarDays.innerHTML += `
			<div class="${cellClass}" onclick="openModal('${dateString}', '${searchName}', '${data.id}', ${data.score}, ${data.maxScore}, '${data.status}')">
				${dayNum}
				${displayHtml}
			</div>
			`;
			} else {
			calendarDays.innerHTML += `
			<div class="day-cell" onclick="openModal('${dateString}', '${searchName}', null, '', '', 'present')">
				${dayNum}
				<span class="empty-label">+ 입력</span>
			</div>
			`;
			}
			}

			const avgBox = document.getElementById('averageScore');
			if (totalMaxScore > 0) {
			const avgScore = Math.round((totalScore / totalMaxScore) * 100);
			avgBox.innerText = `🏆 이번 주 평균 환산 점수: ${avgScore}점`;
			} else {
			avgBox.innerText = `이번 주 계산될 성적이 없습니다.`;
			}

			document.getElementById('calendarArea').style.display = 'block';
			});

			document.getElementById('weekComment').value = "코멘트를 불러오는 중...";
			db.collection("evaluations")
			.where("name", "==", searchName)
			.where("week", "==", currentMondayString)
			.get()
			.then(snap => {
			if(!snap.empty) {
			document.getElementById('weekComment').value = snap.docs[0].data().comment;
			} else {
			document.getElementById('weekComment').value = "";
			}
			});
			}

			function toggleScoreInputs() {
			const status = document.getElementById('modalStatus').value;
			const scoreArea = document.getElementById('scoreInputArea');
			if (status === 'present') {
			scoreArea.style.display = 'flex';
			} else {
			scoreArea.style.display = 'none';
			}
			}

			function openModal(date, name, docId, score, maxScore, status) {
			editDocId = docId;
			editDate = date;
			editName = name;

			const modalTitle = document.getElementById('modalTitle');
			const deleteBtn = document.getElementById('modalDeleteBtn');
			const scoreInput = document.getElementById('modalScore');
			const maxScoreInput = document.getElementById('modalMaxScore');
			const statusInput = document.getElementById('modalStatus');

			if (docId) {
			modalTitle.innerText = `${date} 기록 수정`;
			statusInput.value = status;
			scoreInput.value = score !== null ? score : '';
			maxScoreInput.value = maxScore !== null ? maxScore : '';
			deleteBtn.style.display = 'block';
			} else {
			modalTitle.innerText = `${date} 새 기록 입력`;
			statusInput.value = 'present';
			scoreInput.value = '';
			maxScoreInput.value = '';
			deleteBtn.style.display = 'none';
			}
			toggleScoreInputs();
			document.getElementById('scoreModal').style.display = 'flex';
			}

			function closeModal() {
			document.getElementById('scoreModal').style.display = 'none';
			}

			function saveModalScore() {
			const status = document.getElementById('modalStatus').value;
			let score = 0;
			let maxScore = 0;

			if (status === 'present') {
			score = document.getElementById('modalScore').value;
			maxScore = document.getElementById('modalMaxScore').value;

			if (score === "" || maxScore === "") {
			alert("점수와 만점 기준을 모두 입력해주세요!");
			return;
			}
			if (Number(score) > Number(maxScore)) {
			alert("획득 점수가 만점보다 클 수 없습니다.");
			return;
			}
			}

			const payload = {
			name: editName,
			date: editDate,
			status: status,
			score: status === 'present' ? Number(score) : null,
			maxScore: status === 'present' ? Number(maxScore) : null,
			timestamp: firebase.firestore.FieldValue.serverTimestamp()
			};

			if (editDocId) {
			db.collection("scores").doc(editDocId).update(payload).then(() => {
			closeModal();
			searchReport();
			});
			} else {
			db.collection("scores").add(payload).then(() => {
			closeModal();
			searchReport();
			});
			}
			}

			function deleteModalScore() {
			if (confirm(`정말로 ${editDate} 날짜의 기록을 삭제하시겠습니까?`)) {
			db.collection("scores").doc(editDocId).delete().then(() => {
			closeModal();
			searchReport();
			});
			}
			}

			function saveEvaluation() {
			const searchName = document.getElementById('studentSelector').value;
			const comment = document.getElementById('weekComment').value.trim();

			if (!searchName) return alert("학생을 먼저 선택해주세요.");
			if (!currentMondayString) return;

			db.collection("evaluations")
			.where("name", "==", searchName)
			.where("week", "==", currentMondayString)
			.get()
			.then(snap => {
			if(!snap.empty) {
			db.collection("evaluations").doc(snap.docs[0].id).update({
			comment: comment,
			timestamp: firebase.firestore.FieldValue.serverTimestamp()
			}).then(() => alert("평가가 성공적으로 수정되었습니다!"));
			} else {
			db.collection("evaluations").add({
			name: searchName,
			week: currentMondayString,
			comment: comment,
			timestamp: firebase.firestore.FieldValue.serverTimestamp()
			}).then(() => alert("평가가 성공적으로 저장되었습니다!"));
			}
			});
			}

			function copyParentLink() {
			const name = document.getElementById('studentSelector').value;
			if (!name) { alert("먼저 학생을 선택해 주세요."); return; }
			if (!currentMondayString) { alert("날짜 정보를 불러오지 못했습니다."); return; }

			const currentUrl = window.location.href.split('report.html')[0].split('?')[0];
			const finalLink = `${currentUrl}parent.html?name=${encodeURIComponent(name)}&date=${currentMondayString}`;

			navigator.clipboard.writeText(finalLink).then(() => {
			alert(`✅ 링크가 자동으로 복사되었습니다!\n\n이제 카카오톡 채팅창에 '붙여넣기'만 하시면 됩니다.\n(현재 화면에 떠 있는 주차의 성적표가 전송됩니다.)`);
			}).catch(err => {
			prompt("자동 복사가 차단되었습니다. 아래 주소를 직접 복사(Ctrl+C)해 주세요:", finalLink);
			});
			}
		</script>
	</body>
</html>
