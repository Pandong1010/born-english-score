<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>BORN 영어학원 성적 관리</title>
				<style>
					body {
					margin: 0; padding: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #F4F7F6;
					color: #333; display: flex; justify-content: center;
					}
					.app-container {
					width: 100%; max-width: 480px; min-height: 100vh;
					background-color: #FFF; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
					padding: 30px 20px; box-sizing: border-box;
					}
					header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #F0F2F5; padding-bottom: 15px;}

					.brand-title { font-size: 18px; font-weight: 700; color: #1E3A8A; margin: 0; }
					.brand-subtitle { font-size: 13px; color: #6C757D; margin-top: 4px; }

					/* 🚨 검색 박스를 드롭다운 2개와 버튼이 잘 어울리게 수정했습니다 */
					.search-box { display: flex; gap: 6px; margin-bottom: 20px; }
					.search-box select {
					flex: 1; padding: 10px; font-size: 13px;
					border: 1px solid #D1D5DB; border-radius: 8px; outline: none;
					}
					.search-box button {
					padding: 0 14px; font-size: 13px; font-weight: 600; color: #FFF;
					background-color: #1E3A8A; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap;
					}

					.calendar-container { display: none; margin-top: 20px; }
					.month-title { text-align: center; font-size: 16px; font-weight: bold; color: #374151; margin-bottom: 10px; }
					.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
					.day-header { font-size: 11px; color: #6B7280; font-weight: 600; padding-bottom: 5px; }
					.day-cell { border: 1px solid #E5E7EB; border-radius: 6px; padding: 8px 2px; min-height: 50px; font-size: 12px; background: #FFF; color: #9CA3AF;}

					.day-cell.has-score { background: #EFF6FF; border-color: #BFDBFE; color: #1E3A8A; font-weight: 600; }
					.score-label { display: block; font-size: 11px; color: #E11D48; margin-top: 4px; font-weight: bold; letter-spacing: -0.5px; }

					.summary-box { background: #F8FAFC; border-radius: 8px; padding: 15px; text-align: center; margin-top: 20px; font-size: 15px; font-weight: 600; color: #0F172A;}

					.btn-share {
					width: 100%; padding: 14px; margin-top: 15px; font-size: 14px; font-weight: 600;
					color: #475569; background-color: #FEE500; border: none; border-radius: 8px;
					cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
					}
					.btn-share:hover { background-color: #F4DC00; }

					.nav-links { display: flex; justify-content: space-between; margin-top: 25px; padding: 0 10px; }
					.nav-links a { font-size: 13px; color: #6C757D; text-decoration: none; font-weight: 600; }
					.nav-links a:hover { color: #2B4C7E; text-decoration: underline; }
				</style>

				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container">
			<header>
				<h1 class="brand-title">BORN 영어학원</h1>
				<div class="brand-subtitle">월간 단어 성적 관리</div>
			</header>

			<!-- 🚨 직접 타이핑하던 input 칸을 지우고 select(드롭다운)로 바꿨습니다 -->
			<div class="search-box">
				<select id="classSelector" onchange="loadStudents()">
					<option value="">반 선택</option>
				</select>
				<select id="studentSelector">
					<option value="">학생 선택</option>
				</select>
				<button onclick="searchReport()">기록 열람</button>
			</div>

			<div id="calendarArea" class="calendar-container">
				<div class="month-title" id="monthTitle">이번 달 단어 성적</div>

				<div class="calendar-grid">
					<div class="day-header" style="color:#EF4444;">일</div>
					<div class="day-header">월</div>
					<div class="day-header">화</div>
					<div class="day-header">수</div>
					<div class="day-header">목</div>
					<div class="day-header">금</div>
					<div class="day-header" style="color:#3B82F6;">토</div>
				</div>

				<div class="calendar-grid" id="calendarDays"></div>

				<div class="summary-box" id="averageScore">
					누적 평균: 데이터를 불러오는 중...
				</div>

				<button class="btn-share" onclick="copyParentLink()">
					💬 학부모님용 카톡 링크 자동 복사하기
				</button>
			</div>

			<div class="nav-links">
				<a href="manage.html">⚙️ 반/학생 관리</a>
				<a href="index.html">← 점수 입력으로 돌아가기</a>
			</div>
		</div>

		<script>
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			window.onload = function() {
			const urlParams = new URLSearchParams(window.location.search);
			const studentNameFromUrl = urlParams.get('studentName');

			// 1. 화면이 켜지면 반 목록을 먼저 불러옵니다.
			db.collection("classes").orderBy("createdAt", "asc").get().then((snapshot) => {
			const classSelector = document.getElementById('classSelector');
			snapshot.forEach((doc) => {
			const data = doc.data();
			classSelector.innerHTML += `<option value="${doc.id}">${data.name}</option>`;
			});

			// 2. 만약 다른 화면에서 학생 이름 정보가 넘어왔다면?
			if (studentNameFromUrl) {
			// 그 학생이 어느 반인지 데이터베이스에서 찾은 다음, 자동으로 세팅해 줍니다!
			db.collection("students").where("name", "==", studentNameFromUrl).get().then(studentSnap => {
			if (!studentSnap.empty) {
			const studentData = studentSnap.docs[0].data();
			classSelector.value = studentData.classId; // 반 자동 선택
			loadStudents(studentNameFromUrl, true); // 학생 자동 선택 & 바로 검색
			}
			});
			}
			});
			};

			// 반을 선택하면 학생 목록을 불러오는 함수
			function loadStudents(autoSelectName = null, autoSearch = false) {
			const classId = document.getElementById('classSelector').value;
			const studentSelector = document.getElementById('studentSelector');

			if (!classId) {
			studentSelector.innerHTML = '<option value="">학생 선택</option>';
			return;
			}

			studentSelector.innerHTML = '<option value="">불러오는 중...</option>';

			db.collection("students").where("classId", "==", classId).get().then((snapshot) => {
			studentSelector.innerHTML = '<option value="">학생 선택</option>';
			snapshot.forEach((doc) => {
			const data = doc.data();
			studentSelector.innerHTML += `<option value="${data.name}">${data.name}</option>`;
			});

			// 자동 선택 기능이 발동되었을 때 처리
			if (autoSelectName) {
			studentSelector.value = autoSelectName;
			if (autoSearch) {
			searchReport(); // 선택 완료 후 자동으로 기록 열람까지 실행!
			}
			}
			});
			}

			function searchReport() {
			const searchName = document.getElementById('studentSelector').value;
			if (!searchName) { alert("먼저 확인하실 학생을 선택해 주세요."); return; }

			const now = new Date();
			const year = now.getFullYear();
			const month = now.getMonth();

			document.getElementById('monthTitle').innerText = `${year}년 ${month + 1}월 단어 성적표`;

			const firstDay = new Date(year, month, 1).getDay();
			const daysInMonth = new Date(year, month + 1, 0).getDate();

			const calendarDays = document.getElementById('calendarDays');
			calendarDays.innerHTML = '';

			for (let i = 0; i < firstDay; i++) {
                calendarDays.innerHTML += `<div class="day-cell"></div>`;
			}

			for (let day = 1; day <= daysInMonth; day++) {
			const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
			calendarDays.innerHTML += `<div class="day-cell" id="date-${dateString}">${day}</div>`;
			}

			db.collection("scores").where("name", "==", searchName).get()
			.then((querySnapshot) => {
			let totalScore = 0;
			let totalMaxScore = 0;

			querySnapshot.forEach((doc) => {
			const data = doc.data();
			const dayCell = document.getElementById(`date-${data.date}`);
			if (dayCell) {
			dayCell.classList.add('has-score');
			dayCell.innerHTML += `<span class="score-label">${data.score}/${data.maxScore}</span>`;
			totalScore += data.score;
			totalMaxScore += data.maxScore;
			}
			});

			const avgBox = document.getElementById('averageScore');
			if (totalMaxScore > 0) {
			const avgScore = Math.round((totalScore / totalMaxScore) * 100);
			avgBox.innerText = `🏆 이번 달 평균 환산 점수: ${avgScore}점`;
			} else {
			avgBox.innerText = `이번 달 입력된 성적이 없습니다.`;
			}

			document.getElementById('calendarArea').style.display = 'block';
			});
			}

			function copyParentLink() {
			const name = document.getElementById('studentSelector').value;
			if (!name) { alert("먼저 학생을 선택해 주세요."); return; }

			const currentUrl = window.location.href.split('report.html')[0].split('?')[0];
			const finalLink = `${currentUrl}parent.html?name=${encodeURIComponent(name)}`;

			navigator.clipboard.writeText(finalLink).then(() => {
			alert(`✅ 링크가 자동으로 복사되었습니다!\n\n이제 카카오톡 채팅창에 '붙여넣기'만 하시면 됩니다.`);
			}).catch(err => {
			prompt("자동 복사가 차단되었습니다. 아래 주소를 직접 복사(Ctrl+C)해 주세요:", finalLink);
			});
			}
		</script>
	</body>
</html>
