<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>BORN 영어학원 성취도 평가 안내</title>
				<style>
					body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background-color: #F4F7F6; color: #333; display: flex; justify-content: center; }
					.app-container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #FFF; padding: 40px 20px; box-sizing: border-box; text-align: center;}

					.logo-img { width: 160px; height: auto; margin-bottom: 15px; border-radius: 12px; }
					.brand-title { font-size: 20px; font-weight: 800; color: #1E3A8A; margin: 0 0 5px 0; }

					.result-box { margin: 25px 0; padding: 25px 15px; border-radius: 12px; background: #F8FAFC; border: 2px solid #E2E8F0; }
					.student-name { font-size: 18px; font-weight: bold; color: #334155; margin-bottom: 15px; }
					.result-badge { display: inline-block; padding: 8px 20px; border-radius: 30px; font-size: 24px; font-weight: 900; letter-spacing: 1px; margin-bottom: 15px;}
					.badge-pass { background: #D1FAE5; color: #059669; border: 2px solid #34D399; }
					.badge-unpass { background: #FEE2E2; color: #DC2626; border: 2px solid #F87171; }

					.teacher-comment { font-size: 14px; color: #4B5563; background: #FFF; border: 1px solid #CBD5E1; padding: 15px; border-radius: 8px; text-align: left; line-height: 1.5; white-space: pre-wrap;}
					.teacher-comment b { color: #1E3A8A; display: block; margin-bottom: 5px; font-size: 13px;}

					.date-section { margin-top: 30px; text-align: left; background: #FFF; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #E5E7EB;}
					.date-section h3 { font-size: 15px; color: #1E3A8A; margin-top: 0; margin-bottom: 15px; text-align: center;}
					.instruction { font-size: 13px; color: #6B7280; text-align: center; margin-bottom: 20px; word-break: keep-all; line-height: 1.5; }

					.btn-date { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; color: #1E3A8A; background-color: #EFF6FF; border: 2px solid #BFDBFE; border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
					.btn-date:hover { background-color: #DBEAFE; }

					.success-msg { display: none; margin-top: 20px; padding: 20px; background: #ECFDF5; border: 2px solid #6EE7B7; border-radius: 12px; color: #065F46; font-weight: bold; font-size: 15px; }

					/* 에러 메시지 스타일 강화 */
					.error-msg { margin-top: 50px; font-weight: bold; color: #EF4444; border: 1px solid #FCA5A5; background: #FEF2F2; padding: 20px; border-radius: 12px; line-height: 1.6;}
				</style>

				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container" id="mainContainer" style="display: none;">
			<img src="KakaoTalk_20260808_183941740_01.png" alt="BORN 영어학원 로고" class="logo-img">
				<h1 class="brand-title">BORN 영어학원</h1>
				<div style="color: #6C757D; font-size: 14px; font-weight: 600;">성취도 평가 결과 안내</div>

				<div class="result-box">
					<div class="student-name" id="displayStudentName"></div>
					<div id="displayResult" class="result-badge"></div>

					<div class="teacher-comment">
						<b>📝 원장님 코멘트</b>
						<span id="displayComment"></span>
					</div>
				</div>

				<div class="date-section" id="dateSelectionArea" style="display: none;">
					<h3>🗓️ 학부모님 상담 일정 선택</h3>
					<div class="instruction">
						안내를 위한 일정을 확인하시고,<br>원하시는 날짜를 아래 버튼을 눌러 확정해 주세요.
            </div>
					<button class="btn-date" id="btnDate1" onclick="submitChoice(1)"></button>
					<button class="btn-date" id="btnDate2" onclick="submitChoice(2)"></button>
				</div>

				<div class="success-msg" id="successArea">
					✅ <span id="confirmedDate"></span><br>일정 확정이 완료되었습니다. 감사합니다!
        
				</div>
			</div>

		<!-- 🚨 오류가 발생했을 때 정확한 이유를 보여주도록 업그레이드! -->
		<div class="app-container" id="errorContainer" style="display: none;">
			<div class="error-msg">
				⚠️ 잘못된 접근이거나 삭제된 내역입니다.<br>
					<span id="errorReason" style="font-size: 13px; color: #9CA3AF; font-weight: normal; margin-top: 10px; display: block;"></span>
				</div>
		</div>

		<script>
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			let docId = "";
			let option1 = "";
			let option2 = "";

			function showError(reason) {
			document.getElementById('errorContainer').style.display = "block";
			document.getElementById('errorReason').innerText = reason;
			}

			window.onload = function() {
			const urlParams = new URLSearchParams(window.location.search);
			docId = urlParams.get('id');

			if (!docId) {
			showError("오류 원인: 주소창에 학생 고유 ID가 없습니다. 선생님이 보내주신 원본 링크 전체를 복사해서 열어주세요.");
			} else {
			loadAssessmentInfo();
			}
			};

			function loadAssessmentInfo() {
			db.collection("assessments").doc(docId).get().then((doc) => {
			if (!doc.exists) {
			showError("오류 원인: 해당 성취도 평가 내역이 선생님에 의해 삭제되었거나 존재하지 않습니다.");
			return;
			}

			const data = doc.data();
			document.getElementById('mainContainer').style.display = "block";

			const classNameStr = data.className ? `[${data.className}] ` : "";
			const monthStr = data.displayMonth ? ` (${data.displayMonth} 성취도)` : "";
			document.getElementById('displayStudentName').innerText = `${classNameStr}${data.name} 학생${monthStr}`;

			document.getElementById('displayComment').innerText = data.comment || "작성된 코멘트가 없습니다.";

			const resultBadge = document.getElementById('displayResult');
			resultBadge.innerText = data.result;

			if(data.result === 'PASS') {
			resultBadge.classList.add('badge-pass');
			document.getElementById('dateSelectionArea').style.display = "none";
			document.getElementById('confirmedDate').innerText = "훌륭하게 통과했습니다!";
			document.getElementById('successArea').style.display = "block";
			} else {
			resultBadge.classList.add('badge-unpass');

			if (data.parentChoice) {
			document.getElementById('dateSelectionArea').style.display = "none";
			document.getElementById('confirmedDate').innerText = data.parentChoice;
			document.getElementById('successArea').style.display = "block";
			} else {
			document.getElementById('dateSelectionArea').style.display = "block";
			option1 = data.dateOption1;
			option2 = data.dateOption2;
			document.getElementById('btnDate1').innerText = `👉 ${option1} 선택하기`;
			document.getElementById('btnDate2').innerText = `👉 ${option2} 선택하기`;
			}
			}
			}).catch(error => {
			showError("오류 원인: 데이터를 불러오는 중 통신 오류가 발생했습니다. (" + error.message + ")");
			});
			}

			function submitChoice(choiceNum) {
			const chosenDate = choiceNum === 1 ? option1 : option2;

			if (confirm(`'${chosenDate}' 일정을 확정하시겠습니까?`)) {
			db.collection("assessments").doc(docId).update({
			parentChoice: chosenDate
			}).then(() => {
			document.getElementById('dateSelectionArea').style.display = "none";
			document.getElementById('confirmedDate').innerText = chosenDate;
			document.getElementById('successArea').style.display = "block";
			}).catch(error => {
			alert("오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
			});
			}
			}
		</script>
	</body>
</html>
