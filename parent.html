<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>본 영어학원 주간 성적표</title>
				<style>
					body {
					margin: 0; padding: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #F4F7F6;
					color: #333; display: flex; justify-content: center;
					}
					.app-container {
					width: 100%; max-width: 480px; min-height: 100vh;
					background-color: #FFF; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
					padding: 30px 20px; box-sizing: border-box;
					}
					header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #F0F2F5; padding-bottom: 15px;}

					/* 🚨 시바 로고 160px 유지 */
					.logo-img { width: 160px; height: auto; margin-bottom: 10px; border-radius: 12px; }

					.brand-title { font-size: 18px; font-weight: 700; color: #1E3A8A; margin: 0; }
					.student-title { font-size: 16px; font-weight: 800; color: #E11D48; margin-top: 8px; }

					.week-nav { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; padding: 0 10px; }
					.month-title { text-align: center; font-size: 16px; font-weight: bold; color: #374151; margin: 0; }

					.calendar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
					.day-header { font-size: 12px; color: #4B5563; font-weight: 700; padding-bottom: 5px; }
					.day-cell { border: 1px solid #E5E7EB; border-radius: 6px; padding: 8px 2px; min-height: 55px; font-size: 12px; background: #FFF; color: #9CA3AF; display: flex; flex-direction: column; justify-content: center;}

					.day-cell.has-score { background: #EFF6FF; border-color: #BFDBFE; color: #1E3A8A; font-weight: 600; }

					.day-cell.status-absent { background: #FEF2F2; border-color: #FECACA; }
					.day-cell.status-noclass { background: #F3F4F6; border-color: #E5E7EB; }

					.score-label { display: block; font-size: 13px; color: #E11D48; margin-top: 4px; font-weight: bold; letter-spacing: -0.5px; }

					.summary-box { background: #F8FAFC; border-radius: 8px; padding: 15px; text-align: center; margin-top: 20px; font-size: 15px; font-weight: 600; color: #0F172A;}

					.eval-box { margin-top: 20px; background: #FFF; border: 1px solid #E2E8F0; border-radius: 8px; padding: 15px; }
					.eval-box h3 { font-size: 14px; margin: 0 0 12px 0; color: #1E3A8A; }
					.comment-display {
					width: 100%; padding: 15px; font-size: 14px; background-color: #F8FAFC;
					border-radius: 6px; box-sizing: border-box; line-height: 1.6; color: #334155;
					min-height: 70px; white-space: pre-wrap;
					}

					.error-msg { text-align: center; font-size: 15px; font-weight: bold; color: #EF4444; margin-top: 50px; }
				</style>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>
		<div class="app-container" id="mainContainer" style="display: none;">
			<header>
				<img src="KakaoTalk_20260808_183941740_01.png" alt="본 영어학원 로고" class="logo-img">
					<h1 class="brand-title">본 영어학원</h1>
					<div class="student-title" id="headerStudentName">학생 주간 성적표</div>
				</header>

			<div class="week-nav">
				<div class="month-title" id="weekTitle">이번 주 성적</div>
			</div>

			<div class="calendar-grid">
				<div class="day-header">월</div>
				<div class="day-header">화</div>
				<div class="day-header">수</div>
				<div class="day-header">목</div>
				<div class="day-header">금</div>
			</div>

			<div class="calendar-grid" id="calendarDays"></div>

			<div class="summary-box" id="averageScore">
				데이터를 불러오는 중...
			</div>

			<div class="eval-box">
				<h3>📝 선생님의 주간 코멘트</h3>
				<div id="weekComment" class="comment-display">코멘트를 불러오는 중...</div>
			</div>
		</div>

		<div id="errorContainer" class="error-msg" style="display: none;">
			잘못된 접근입니다. 올바른 링크로 다시 접속해 주세요.
		</div>

		<script>
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			let currentViewDate = new Date();
			let currentMondayString = "";
			let studentName = "";

			window.onload = function() {
			const urlParams = new URLSearchParams(window.location.search);
			studentName = urlParams.get('name');
			const specificDate = urlParams.get('date');

			if (!studentName) {
			document.getElementById('errorContainer').style.display = "block";
			} else {
			document.getElementById('headerStudentName').innerText = `🏆 ${studentName} 학생 주간 성적표`;

			if (specificDate) {
			currentViewDate = new Date(specificDate);
			} else {
			currentViewDate = new Date();
			}

			document.getElementById('mainContainer').style.display = "block";
			loadReport();
			}
			};

			function loadReport() {
			const d = new Date(currentViewDate);
			const day = d.getDay();
			const diff = d.getDate() - day + (day === 0 ? -6 : 1);

			const monday = new Date(d.setDate(diff));
			const friday = new Date(monday);
			friday.setDate(monday.getDate() + 4);

			currentMondayString = `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;

			document.getElementById('weekTitle').innerText =
			`${monday.getMonth() + 1}월 ${monday.getDate()}일 ~ ${friday.getMonth() + 1}월 ${friday.getDate()}일`;

			const calendarDays = document.getElementById('calendarDays');
			calendarDays.innerHTML = '';

			const weekDates = [];
			for (let i = 0; i < 5; i++) {
                const curr = new Date(monday);
                curr.setDate(monday.getDate() + i);                
                const yyyy = curr.getFullYear();
                const mm = String(curr.getMonth() + 1).padStart(2, '0');
                const dd = String(curr.getDate()).padStart(2, '0');
                const dateString = `${yyyy}-${mm}-${dd}`;                
                weekDates.push(dateString); 
            }

            db.collection("scores").where("name", "==", studentName).get()
            .then((querySnapshot) => {
                let totalScore = 0;
                let totalMaxScore = 0;
                let scoresData = {};

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (weekDates.includes(data.date)) {
                        scoresData[data.date] = { 
                            id: doc.id, 
                            score: data.score, 
                            maxScore: data.maxScore,
                            status: data.status || 'present'
                        };
                    }
                });

                for (let i = 0; i < 5; i++) {
                    const dateString = weekDates[i];
                    const dObj = new Date(dateString);
                    const dayNum = dObj.getDate();

                    if (scoresData[dateString]) {
                        const data = scoresData[dateString];
                        let displayHtml = '';
                        let cellClass = 'day-cell has-score';

                        if (data.status === 'absent') {
                            displayHtml = `<span class="score-label" style="color:#EF4444; font-size:13px;">결석</span>`;
			cellClass += ' status-absent';
			} else if (data.status === 'no_class') {
			displayHtml = `<span class="score-label" style="color:#9CA3AF; font-size:13px;">수업 없음</span>`;
			cellClass += ' status-noclass';
			} else {
			displayHtml = `<span class="score-label">${data.score}/${data.maxScore}</span>`;
			totalScore += data.score;
			totalMaxScore += data.maxScore;
			}

			calendarDays.innerHTML += `
			<div class="${cellClass}">
				${dayNum}
				${displayHtml}
			</div>
			`;
			} else {
			calendarDays.innerHTML += `
			<div class="day-cell">
				${dayNum}
			</div>
			`;
			}
			}

			const avgBox = document.getElementById('averageScore');
			if (totalMaxScore > 0) {
			const avgScore = Math.round((totalScore / totalMaxScore) * 100);
			avgBox.innerText = `이번 주 평균 환산 점수: ${avgScore}점`;
			} else {
			avgBox.innerText = `이번 주 계산될 성적이 없습니다.`;
			}
			});

			document.getElementById('weekComment').innerText = "코멘트를 불러오는 중...";
			db.collection("evaluations")
			.where("name", "==", studentName)
			.where("week", "==", currentMondayString)
			.get()
			.then(snap => {
			if(!snap.empty) {
			document.getElementById('weekComment').innerText = snap.docs[0].data().comment;
			} else {
			document.getElementById('weekComment').innerText = "이번 주 코멘트가 아직 작성되지 않았습니다.";
			}
			});
			}
		</script>
	</body>
</html>
