<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>BORN 영어학원 성적표</title>
				<style>
					body {
					margin: 0; padding: 0;
					font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #F7F9FC;
					color: #333; display: flex; justify-content: center;
					}

					.app-container {
					width: 100%; max-width: 480px; min-height: 100vh;
					background-color: #FFFFFF;
					box-shadow: 0 10px 30px rgba(0,0,0,0.05);
					position: relative; overflow: hidden;
					}

					header {
					background: #FFFFFF;
					padding: 35px 20px 20px;
					text-align: center;
					}

					.brand-logo {
					width: 160px;
					height: auto;
					margin-bottom: 5px;
					}
					.brand-subtitle { font-size: 13px; color: #64748B; font-weight: 600; letter-spacing: 0.5px;}

					.content-area {
					padding: 0 20px 30px;
					position: relative;
					z-index: 10;
					}

					.student-info {
					background-color: #F8FAFC;
					border-radius: 16px;
					padding: 20px; text-align: center; margin-bottom: 24px;
					box-shadow: 0 4px 15px rgba(0,0,0,0.03);
					border: 1px solid #E2E8F0;
					}
					.student-name { font-size: 17px; font-weight: 700; color: #1E293B; }
					.student-name span { color: #3B82F6; }

					.month-title {
					text-align: center; font-size: 16px; font-weight: 800;
					color: #334155; margin-bottom: 16px;
					display: flex; justify-content: center; align-items: center; gap: 8px;
					}
					.calendar-box {
					background: #FFFFFF; border-radius: 16px; padding: 20px 15px;
					box-shadow: 0 4px 15px rgba(0,0,0,0.03);
					border: 1px solid #F1F5F9;
					}
					.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
					.day-header { font-size: 12px; color: #94A3B8; font-weight: 700; padding-bottom: 10px; }
					.day-cell {
					border-radius: 10px; padding: 8px 0; min-height: 55px;
					font-size: 13px; background: #F8FAFC; color: #CBD5E1;
					display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
					}

					.day-cell.has-score { background: #EFF6FF; color: #1E3A8A; font-weight: 700; box-shadow: inset 0 0 0 1px #DBEAFE;}

					/* 12/20 처럼 길어지는 글자가 잘리지 않도록 폰트 크기 및 간격 미세 조정 */
					.score-label { display: block; font-size: 11px; color: #2563EB; margin-top: 6px; font-weight: 800; letter-spacing: -0.5px; }

					.day-cell.perfect-score { background: #FEF3C7; color: #B45309; font-weight: 800; box-shadow: inset 0 0 0 1px #FDE68A;}
					.perfect-score .score-label { color: #D97706; }

					.summary-box {
					background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
					border-radius: 16px; padding: 24px;
					text-align: center; margin-top: 24px;
					color: #FFFFFF;
					box-shadow: 0 8px 20px rgba(30, 41, 59, 0.15);
					}
					.summary-title { font-size: 13px; color: #94A3B8; margin-bottom: 8px; font-weight: 600;}
					.summary-score { font-size: 28px; font-weight: 800; color: #F8FAFC; letter-spacing: -0.5px;}
					.summary-score span { font-size: 14px; font-weight: 500; color: #CBD5E1;} /* '점' 글자 크기 조정 */

					.fade-in { animation: fadeIn 0.8s ease-out forwards; }
					@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
				</style>

				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container">
			<header>
				<img src="KakaoTalk_20260808_183941740_01.png" alt="BORN 영어학원 로고" class="brand-logo">
					<div class="brand-subtitle">Monthly Vocabulary Report</div>
				</header>

			<div class="content-area" id="contentArea">
				<div class="student-info fade-in">
					<div class="student-name" id="studentNameDisplay">데이터를 불러오는 중입니다...</div>
				</div>

				<div class="calendar-box fade-in" style="animation-delay: 0.1s;">
					<div class="month-title" id="monthTitle"></div>

					<div class="calendar-grid">
						<div class="day-header" style="color:#EF4444;">일</div>
						<div class="day-header">월</div>
						<div class="day-header">화</div>
						<div class="day-header">수</div>
						<div class="day-header">목</div>
						<div class="day-header">금</div>
						<div class="day-header" style="color:#3B82F6;">토</div>
					</div>

					<div class="calendar-grid" id="calendarDays"></div>
				</div>

				<div class="summary-box fade-in" id="averageScoreBox" style="animation-delay: 0.2s;">
					<div class="summary-title">이번 달 평균 환산 점수 (100점 만점 기준)</div>
					<div class="summary-score" id="averageScore">
						--<span> 점</span>
					</div>
				</div>
			</div>
		</div>

		<script>
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			const urlParams = new URLSearchParams(window.location.search);
			const studentName = urlParams.get('name');

			document.getElementById('studentNameDisplay').innerHTML = `<span>${studentName}</span> 학생의 단어 성적표`;
			loadStudentData(studentName);

			function loadStudentData(name) {
			const now = new Date();
			const year = now.getFullYear();
			const month = now.getMonth();

			document.getElementById('monthTitle').innerHTML = `📅 ${year}년 ${month + 1}월`;

			const firstDay = new Date(year, month, 1).getDay();
			const daysInMonth = new Date(year, month + 1, 0).getDate();

			const calendarDays = document.getElementById('calendarDays');

			for (let i = 0; i < firstDay; i++) {
        calendarDays.innerHTML += `<div class="day-cell"></div>`;
			}

			for (let day = 1; day <= daysInMonth; day++) {
			const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
			calendarDays.innerHTML += `<div class="day-cell" id="date-${dateString}">${day}</div>`;
			}

			db.collection("scores").where("name", "==", name).get()
			.then((querySnapshot) => {
			let totalScore = 0;
			let totalMaxScore = 0; // 추가된 부분: 총 만점 기준 합산

			querySnapshot.forEach((doc) => {
			const data = doc.data();
			const dayCell = document.getElementById(`date-${data.date}`);

			if (dayCell) {
			totalScore += data.score;
			totalMaxScore += data.maxScore; // 이번 달 총 만점 누적

			// 점수 표시 방식 변경: score/maxScore
			if (data.score === data.maxScore) {
			dayCell.classList.add('perfect-score');
			dayCell.innerHTML += `<span class="score-label">💯 ${data.score}/${data.maxScore}</span>`;
			} else {
			dayCell.classList.add('has-score');
			dayCell.innerHTML += `<span class="score-label">${data.score}/${data.maxScore}</span>`;
			}
			}
			});

			const avgScoreElement = document.getElementById('averageScore');
			if (totalMaxScore > 0) {
			// 환산 공식: (총 획득 점수 / 총 만점 기준) * 100
			const avgScore = Math.round((totalScore / totalMaxScore) * 100);
			avgScoreElement.innerHTML = `${avgScore}<span> 점</span>`;
			} else {
			document.getElementById('averageScoreBox').style.background = "linear-gradient(135deg, #94A3B8 0%, #CBD5E1 100%)";
			avgScoreElement.innerHTML = `<span style="font-size:14px; color:#FFF;">아직 기록된 성적이 없습니다.</span>`;
			}
			});
			}
		</script>

	</body>
</html>
