<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>원장님 전용 계정 관리</title>
				<style>
					body {
					margin: 0; padding: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #1E293B; color: #FFF; display: flex; justify-content: center; min-height: 100vh;
					}
					.app-container {
					width: 100%; max-width: 480px;
					background-color: #0F172A; box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
					padding: 30px 20px; box-sizing: border-box;
					}
					header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 15px;}
					.brand-title { font-size: 20px; font-weight: 700; color: #F8FAFC; margin: 0; }
					.brand-subtitle { font-size: 13px; color: #94A3B8; margin-top: 4px; }

					.card { background-color: #1E293B; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }

					.input-group { margin-bottom: 12px; }
					.input-group input {
					width: 100%; padding: 12px; font-size: 14px; background: #0F172A; color: #FFF;
					border: 1px solid #475569; border-radius: 8px; box-sizing: border-box; outline: none;
					}
					.input-group input:focus { border-color: #3B82F6; }

					.btn-primary {
					width: 100%; padding: 14px; font-size: 14px; font-weight: bold; color: #FFF;
					background-color: #3B82F6; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;
					}
					.btn-primary:hover { background-color: #2563EB; }

					.list-item {
					display: flex; justify-content: space-between; align-items: center;
					background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 8px;
					}
					.list-item span { font-size: 14px; font-weight: bold; }
					.list-item .pw-badge { font-size: 12px; color: #94A3B8; margin-left: 8px; font-weight: normal; }
					.action-btns { display: flex; gap: 6px; }
					.btn-edit { background: #F59E0B; color: #FFF; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold;}
					.btn-delete { background: #EF4444; color: #FFF; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold;}
				</style>

				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container" id="mainContent" style="display: none;">
			<header>
				<h1 class="brand-title">👑 BORN 영어학원 원장실</h1>
				<div class="brand-subtitle">선생님 접속 아이디 발급/관리</div>
			</header>

			<div class="card">
				<h3 style="margin-top:0; font-size:15px; color:#94A3B8;">➕ 새 계정 발급하기</h3>
				<div class="input-group">
					<input type="text" id="newId" placeholder="사용할 아이디 (예: teacher1)">
            </div>
				<div class="input-group">
					<input type="text" id="newPw" placeholder="사용할 비밀번호 (예: 1234)">
            </div>
				<div class="input-group">
					<input type="text" id="newName" placeholder="선생님 이름 (예: 김선생님)">
            </div>
				<button class="btn-primary" onclick="addAccount()">아이디 발급하기</button>
			</div>

			<div class="card">
				<h3 style="margin-top:0; font-size:15px; color:#94A3B8;">📋 등록된 선생님 목록</h3>
				<div id="accountList"></div>
			</div>
		</div>

		<script>
			// 🚨 원장님 전용 암호 확인 (여기서 암호를 바꾸실 수 있습니다)
			const masterPw = prompt("원장님 전용 암호를 입력해주세요.");
			if (masterPw !== "born1004") {
			alert("암호가 틀렸습니다. 접근을 차단합니다.");
			window.location.href = "login.html";
			} else {
			document.getElementById('mainContent').style.display = "block";
			}

			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			window.onload = function() { loadAccounts(); };

			// 아이디 생성
			function addAccount() {
			const id = document.getElementById('newId').value.trim();
			const pw = document.getElementById('newPw').value.trim();
			const name = document.getElementById('newName').value.trim();

			if(!id || !pw || !name) return alert("빈칸을 모두 채워주세요!");

			// 아이디 중복 검사
			db.collection("accounts").where("id", "==", id).get().then(snap => {
			if(!snap.empty) {
			return alert("이미 사용 중인 아이디입니다. 다른 아이디를 입력해주세요.");
			}

			db.collection("accounts").add({
			id: id,
			pw: pw,
			name: name,
			createdAt: firebase.firestore.FieldValue.serverTimestamp()
			}).then(() => {
			alert("성공적으로 발급되었습니다!");
			document.getElementById('newId').value = '';
			document.getElementById('newPw').value = '';
			document.getElementById('newName').value = '';
			loadAccounts();
			});
			});
			}

			// 아이디 목록 불러오기
			function loadAccounts() {
			const accountList = document.getElementById('accountList');
			accountList.innerHTML = '불러오는 중...';

			db.collection("accounts").orderBy("createdAt", "asc").get().then((snapshot) => {
			accountList.innerHTML = '';
			if(snapshot.empty) { accountList.innerHTML = '<div style="font-size:13px; color:#94A3B8;">등록된 계정이 없습니다.</div>'; return; }

			snapshot.forEach((doc) => {
			const data = doc.data();
			accountList.innerHTML += `
			<div class="list-item">
				<div>
					<span>${data.name}</span>
					<div class="pw-badge">ID: ${data.id} / PW: ${data.pw}</div>
				</div>
				<div class="action-btns">
					<button class="btn-edit" onclick="editPw('${doc.id}', '${data.name}', '${data.pw}')">PW변경</button>
					<button class="btn-delete" onclick="deleteAccount('${doc.id}', '${data.name}')">삭제</button>
				</div>
			</div>
			`;
			});
			});
			}

			// 비밀번호 변경
			function editPw(docId, name, currentPw) {
			const newPw = prompt(`${name} 선생님의 새로운 비밀번호를 입력해주세요:`, currentPw);
			if (newPw && newPw.trim() !== "" && newPw !== currentPw) {
			db.collection("accounts").doc(docId).update({ pw: newPw.trim() }).then(() => {
			alert("비밀번호가 변경되었습니다.");
			loadAccounts();
			});
			}
			}

			// 계정 삭제
			function deleteAccount(docId, name) {
			if(confirm(`정말로 '${name}' 선생님의 계정을 삭제하시겠습니까?\n삭제 후에는 해당 아이디로 로그인할 수 없습니다.`)) {
			db.collection("accounts").doc(docId).delete().then(() => { loadAccounts(); });
			}
			}
		</script>
	</body>
</html>
