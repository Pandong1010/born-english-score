<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>BORN 영어학원 로그인</title>
				<style>
					body {
					margin: 0; padding: 0;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
					background-color: #F8F9FA; color: #333333; display: flex; justify-content: center; align-items: center; min-height: 100vh;
					}
					.app-container {
					width: 100%; max-width: 400px;
					background-color: #FFFFFF; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
					padding: 40px 30px; border-radius: 16px; box-sizing: border-box; text-align: center;
					}
					.brand-title { font-size: 24px; font-weight: 800; color: #2B4C7E; letter-spacing: 1px; margin: 0 0 8px 0; }
					.brand-subtitle { font-size: 14px; color: #6C757D; margin-bottom: 30px; }

					.form-group { margin-bottom: 16px; text-align: left; }
					.form-group label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
					.form-group input {
					width: 100%; padding: 14px; font-size: 15px;
					border: 1px solid #CED4DA; border-radius: 8px; box-sizing: border-box; outline: none; transition: border-color 0.2s;
					}
					.form-group input:focus { border-color: #2B4C7E; }

					.btn-submit {
					width: 100%; padding: 16px; font-size: 16px; font-weight: 700; color: #FFFFFF;
					background-color: #2B4C7E; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;
					}
					.btn-submit:hover { background-color: #1A3256; }
					.error-msg { color: #EF4444; font-size: 13px; margin-top: 15px; display: none; font-weight: 600; }
				</style>

				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
				<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
			</head>
	<body>

		<div class="app-container">
			<h1 class="brand-title">BORN 영어학원</h1>
			<div class="brand-subtitle">관리자 시스템 로그인</div>

			<div class="form-group">
				<label>아이디</label>
				<input type="text" id="loginId" placeholder="아이디를 입력하세요">
        </div>
			<div class="form-group">
				<label>비밀번호</label>
				<input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" onkeypress="handleEnter(event)">
        </div>

			<button class="btn-submit" onclick="login()">로그인</button>
			<div id="errorMessage" class="error-msg">아이디 또는 비밀번호가 일치하지 않습니다.</div>
		</div>

		<script>
			const firebaseConfig = {
			apiKey: "AIzaSyCti-4AKWT9kbq_a-HEy0AI-CwfxiZ5Msw",
			authDomain: "bornacademy-713f5.firebaseapp.com",
			projectId: "bornacademy-713f5",
			storageBucket: "bornacademy-713f5.firebasestorage.app",
			messagingSenderId: "767227866395",
			appId: "1:767227866395:web:b0e0e22a1b21a52d10b7be"
			};
			firebase.initializeApp(firebaseConfig);
			const db = firebase.firestore();

			function handleEnter(e) {
			if (e.key === 'Enter') { login(); }
			}

			function login() {
			const id = document.getElementById('loginId').value.trim();
			const pw = document.getElementById('loginPw').value.trim();
			const errorMsg = document.getElementById('errorMessage');

			if(!id || !pw) {
			errorMsg.innerText = "아이디와 비밀번호를 모두 입력해주세요.";
			errorMsg.style.display = "block";
			return;
			}

			// 원장님이 만들어둔 'accounts' 폴더를 뒤져서 아이디/비번이 맞는지 확인합니다.
			db.collection("accounts").where("id", "==", id).get().then(snap => {
			if(snap.empty) {
			errorMsg.innerText = "존재하지 않는 아이디입니다.";
			errorMsg.style.display = "block";
			return;
			}

			const data = snap.docs[0].data();
			if(data.pw === pw) {
			// 로그인 성공! '로그인했다'는 도장을 컴퓨터(브라우저)에 쾅 찍어줍니다.
			sessionStorage.setItem("bornAuth", "true");
			window.location.href = "index.html"; // 점수 입력 화면으로 이동!
			} else {
			errorMsg.innerText = "비밀번호가 일치하지 않습니다.";
			errorMsg.style.display = "block";
			}
			}).catch(err => {
			errorMsg.innerText = "오류가 발생했습니다. 다시 시도해주세요.";
			errorMsg.style.display = "block";
			});
			}
		</script>
	</body>
</html>
